<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saber Training VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; color: #e8ecff; font-family: system-ui, sans-serif; overflow: hidden; }
  #info { position: absolute; top: 16px; left: 16px; right: 16px; max-width: 520px; background: rgba(10,14,30,.8); padding: 14px 16px; border-radius: 12px; line-height: 1.45; font-size: 15px; }
  #info b { color: #7fd4ff; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <b>Saber Training VR</b><br>
  Open this page in the Meta Quest browser and tap <b>Enter VR</b>.<br>
  A training drone shoots blaster bolts at you. Block them with your lightsabers.
  <b>Swing</b> into a bolt to send it back and destroy the drone (+5).
  Squeeze a trigger to restart after game over.
</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const V3 = THREE.Vector3;

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 8, 26);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
camera.position.set(0, 1.6, 0);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x111122, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(2, 5, 3);
scene.add(sun);

// ---------- Environment ----------
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(25, 48),
  new THREE.MeshStandardMaterial({ color: 0x0b0e1a, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);
scene.add(new THREE.GridHelper(40, 40, 0x2a6cff, 0x1a2244));

const pillarMat = new THREE.MeshStandardMaterial({ color: 0x141a30, roughness: 0.6 });
const stripMat = new THREE.MeshBasicMaterial({ color: 0x2a6cff });
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 6, 0.6), pillarMat);
  pillar.position.set(Math.sin(a) * 12, 3, Math.cos(a) * 12);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.62), stripMat);
  strip.position.set(pillar.position.x, 2.5, pillar.position.z);
  scene.add(pillar, strip);
}

const starPos = [];
for (let i = 0; i < 1500; i++) {
  const v = new V3().randomDirection().multiplyScalar(70);
  if (v.y < 0) v.y = -v.y;
  starPos.push(v.x, v.y, v.z);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, fog: false })));

// ---------- Audio (synthesized, no files needed) ----------
let actx = null;
function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
document.addEventListener('click', ensureAudio);
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur);
}

function buzz(controller, intensity = 0.6, ms = 40) {
  const h = controller.userData.input?.gamepad?.hapticActuators?.[0];
  if (h && h.pulse) h.pulse(intensity, ms);
}

// ---------- Lightsabers ----------
const BLADE_LEN = 1.0;
const LEFT_COLOR = 0x44ff77;
const RIGHT_COLOR = 0x3399ff;
const BASE_L = new V3(0, 0, -0.12);
const TIP_L = new V3(0, 0, -0.12 - BLADE_LEN);

function makeSaber() {
  const group = new THREE.Group();
  const hilt = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.021, 0.22, 16),
    new THREE.MeshStandardMaterial({ color: 0x9aa0aa, metalness: 0.9, roughness: 0.3 })
  );
  hilt.rotation.x = -Math.PI / 2;
  hilt.position.z = -0.01;

  const core = new THREE.Mesh(
    new THREE.CylinderGeometry(0.011, 0.011, BLADE_LEN, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  core.rotation.x = -Math.PI / 2;
  core.position.z = BASE_L.z - BLADE_LEN / 2;

  const glowMat = new THREE.MeshBasicMaterial({
    color: RIGHT_COLOR, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, BLADE_LEN + 0.03, 12), glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.z = core.position.z;

  const light = new THREE.PointLight(RIGHT_COLOR, 2, 2.5, 2);
  light.position.z = core.position.z;

  group.add(hilt, core, glow, light);
  return {
    group,
    color: RIGHT_COLOR,
    setColor(hex) { glowMat.color.setHex(hex); light.color.setHex(hex); this.color = hex; }
  };
}

const hands = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const saber = makeSaber();
  c.add(saber.group);
  c.userData = {
    saber, input: null, ready: false, speed: 0,
    base: new V3(), tip: new V3(), prevBase: new V3(), prevTip: new V3(),
    midBase: new V3(), midTip: new V3()
  };
  c.addEventListener('connected', (e) => {
    c.userData.input = e.data;
    c.userData.ready = false;
    saber.group.visible = !e.data.hand; // hide saber when using hand tracking
    saber.setColor(e.data.handedness === 'left' ? LEFT_COLOR : RIGHT_COLOR);
  });
  c.addEventListener('disconnected', () => { c.userData.input = null; c.userData.ready = false; });
  c.addEventListener('selectstart', () => {
    ensureAudio();
    if (gameOver) resetGame();
  });
  scene.add(c);
  hands.push(c);
}

function updateSabers(dt) {
  for (const c of hands) {
    const u = c.userData;
    if (!u.input || !c.visible || !u.saber.group.visible) { u.ready = false; continue; }
    c.updateMatrixWorld(true);
    u.prevBase.copy(u.base);
    u.prevTip.copy(u.tip);
    u.base.copy(BASE_L).applyMatrix4(c.matrixWorld);
    u.tip.copy(TIP_L).applyMatrix4(c.matrixWorld);
    if (!u.ready) { u.prevBase.copy(u.base); u.prevTip.copy(u.tip); u.ready = true; }
    u.midBase.lerpVectors(u.prevBase, u.base, 0.5);
    u.midTip.lerpVectors(u.prevTip, u.tip, 0.5);
    u.speed = u.tip.distanceTo(u.prevTip) / Math.max(dt, 1e-3);
  }
}

// ---------- Geometry helpers ----------
const _ab = new V3(), _ap = new V3(), _cp = new V3();
function distToSeg(p, a, b) {
  _ab.subVectors(b, a);
  _ap.subVectors(p, a);
  const len2 = _ab.lengthSq();
  let t = len2 > 0 ? _ap.dot(_ab) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  _cp.copy(a).addScaledVector(_ab, t);
  return p.distanceTo(_cp);
}

// ---------- Hit flash ----------
const flashMat = new THREE.MeshBasicMaterial({
  color: 0xff0000, transparent: true, opacity: 0,
  side: THREE.BackSide, depthTest: false, fog: false
});
const flash = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), flashMat);
flash.renderOrder = 999;
camera.add(flash);

// ---------- Sparks ----------
const SPARK_GEO = new THREE.BoxGeometry(0.02, 0.02, 0.02);
const sparks = [];
function burst(pos, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(SPARK_GEO, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.copy(pos);
    scene.add(m);
    sparks.push({ m, vel: new V3().randomDirection().multiplyScalar(speed * (0.4 + Math.random())), life: 0.5 });
  }
}
function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    s.vel.y -= 3 * dt;
    s.m.position.addScaledVector(s.vel, dt);
    s.m.material.opacity = Math.max(0, s.life / 0.5);
    if (s.life <= 0) {
      scene.remove(s.m);
      s.m.material.dispose();
      sparks.splice(i, 1);
    }
  }
}

// ---------- Drone ----------
const drone = new THREE.Group();
const droneBody = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0x2a2f3a, metalness: 0.8, roughness: 0.35 })
);
const droneEye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff2a2a }));
droneEye.position.z = 0.14;
const droneRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.24, 0.015, 8, 32),
  new THREE.MeshStandardMaterial({ color: 0x667088, metalness: 0.9, roughness: 0.3 })
);
droneRing.rotation.x = Math.PI / 2;
const droneLight = new THREE.PointLight(0xff3333, 1.2, 2);
drone.add(droneBody, droneEye, droneRing, droneLight);
drone.position.set(0, 1.6, -3);
scene.add(drone);

const head = new V3(0, 1.6, 0);
const droneTarget = new V3();
let droneAlive = true, respawnTimer = 0, fireTimer = 2.5, moveTimer = 0, time = 0;

function pickDronePoint(out) {
  const a = (Math.random() - 0.5) * Math.PI * 0.7; // within ~63° of straight ahead
  const d = 3.5 + Math.random() * 1.5;
  return out.set(head.x + Math.sin(a) * d, 1.3 + Math.random() * 0.9, head.z - Math.cos(a) * d);
}

function spawnDrone() {
  pickDronePoint(drone.position);
  pickDronePoint(droneTarget);
  drone.visible = true;
  droneAlive = true;
  fireTimer = 1.2;
  moveTimer = 2;
  burst(drone.position, 0xff5555, 14, 1.5);
  tone(300, 0.25, 'triangle', 0.08, 400);
}

// ---------- Bolts ----------
const BOLT_CORE_GEO = new THREE.CylinderGeometry(0.01, 0.01, 0.28, 8);
const BOLT_GLOW_GEO = new THREE.CylinderGeometry(0.028, 0.028, 0.32, 8);
const UP = new V3(0, 1, 0);
const _dir = new V3();
const bolts = [];

function orientBolt(b) {
  b.mesh.quaternion.setFromUnitVectors(UP, _dir.copy(b.vel).normalize());
}

function fireBolt() {
  const speed = Math.min(3 + score * 0.06, 7.5);
  // aim at head/chest with some spread
  const target = head.clone().add(new V3((Math.random() - 0.5) * 0.5, -0.15 - Math.random() * 0.45, 0));
  const dir = target.sub(drone.position).normalize();

  const mesh = new THREE.Mesh(BOLT_CORE_GEO, new THREE.MeshBasicMaterial({ color: 0xffdddd }));
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xff2020, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  mesh.add(new THREE.Mesh(BOLT_GLOW_GEO, glowMat));
  mesh.position.copy(drone.position).addScaledVector(dir, 0.25);
  scene.add(mesh);

  const b = { mesh, glowMat, vel: dir.multiplyScalar(speed), prev: mesh.position.clone(), deflected: false, life: 4 };
  orientBolt(b);
  bolts.push(b);
  tone(900, 0.12, 'sawtooth', 0.05, -500);
}

function killBolt(b) {
  scene.remove(b.mesh);
  b.mesh.material.dispose();
  b.glowMat.dispose();
}

function clearBolts() {
  for (const b of bolts) killBolt(b);
  bolts.length = 0;
}

function deflect(b, c) {
  const u = c.userData;
  b.deflected = true;
  b.life = 3;
  const speed = b.vel.length() * 1.4;
  const dir = new V3();
  if (droneAlive && u.speed > 1.2) {
    // a real swing sends it back at the drone
    dir.copy(drone.position).sub(b.mesh.position).normalize();
    dir.x += (Math.random() - 0.5) * 0.05;
    dir.y += (Math.random() - 0.5) * 0.05;
  } else {
    // a passive block just knocks it away
    dir.copy(b.vel).normalize().negate();
    dir.x += (Math.random() - 0.5) * 1.2;
    dir.y = Math.abs(dir.y) + 0.3 + Math.random() * 0.6;
  }
  dir.normalize();
  b.vel.copy(dir).multiplyScalar(speed);
  orientBolt(b);
  b.glowMat.color.setHex(u.saber.color);

  score += 1;
  if (score > best) saveBest(score);
  drawHUD();
  burst(b.mesh.position, u.saber.color, 10, 2);
  tone(1500 + Math.random() * 400, 0.08, 'square', 0.06, -900);
  buzz(c, 0.6, 35);
}

function destroyDrone() {
  droneAlive = false;
  drone.visible = false;
  respawnTimer = 1.0;
  score += 5;
  if (score > best) saveBest(score);
  drawHUD();
  burst(drone.position, 0xffaa33, 40, 3);
  tone(90, 0.5, 'sawtooth', 0.15, -50);
  tone(600, 0.3, 'triangle', 0.08, -500);
  for (const c of hands) buzz(c, 0.4, 80);
}

function hitPlayer() {
  health -= 1;
  flashMat.opacity = 0.5;
  drawHUD();
  tone(120, 0.3, 'sawtooth', 0.15, -60);
  for (const c of hands) buzz(c, 1.0, 120);
}

const bodyTop = new V3(), bodyBottom = new V3();
function updateBolts(dt) {
  bodyTop.copy(head);
  bodyBottom.copy(head);
  bodyBottom.y -= 0.7;

  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.prev.copy(b.mesh.position);
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    const p = b.mesh.position;
    let remove = false;

    if (!b.deflected) {
      for (const c of hands) {
        const u = c.userData;
        if (!u.ready) continue;
        const d = Math.min(
          distToSeg(p, u.base, u.tip),
          distToSeg(p, u.midBase, u.midTip),
          distToSeg(b.prev, u.base, u.tip)
        );
        if (d < 0.09) { deflect(b, c); break; }
      }
      if (!b.deflected && distToSeg(p, bodyTop, bodyBottom) < 0.18) {
        hitPlayer();
        remove = true;
      }
    } else if (droneAlive && p.distanceTo(drone.position) < 0.32) {
      destroyDrone();
      remove = true;
    }

    if (b.life <= 0 || p.y < -0.5) remove = true;
    if (remove) { killBolt(b); bolts.splice(i, 1); }
  }
}

// ---------- HUD ----------
const hudCanvas = document.createElement('canvas');
hudCanvas.width = 1024;
hudCanvas.height = 256;
const hctx = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas);
hudTex.colorSpace = THREE.SRGBColorSpace;
const hud = new THREE.Mesh(
  new THREE.PlaneGeometry(1.2, 0.3),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, fog: false })
);
hud.position.set(0, 2.55, -3.2);
scene.add(hud);

function drawHUD() {
  const w = hudCanvas.width, h = hudCanvas.height;
  hctx.clearRect(0, 0, w, h);
  hctx.fillStyle = 'rgba(10,16,40,0.75)';
  hctx.fillRect(0, 0, w, h);
  hctx.strokeStyle = '#2a6cff';
  hctx.lineWidth = 6;
  hctx.strokeRect(3, 3, w - 6, h - 6);

  hctx.textBaseline = 'middle';
  hctx.font = 'bold 64px system-ui, sans-serif';
  hctx.fillStyle = '#e8ecff';
  hctx.textAlign = 'left';
  hctx.fillText(`SCORE ${score}`, 40, 80);
  hctx.textAlign = 'right';
  hctx.fillStyle = '#7fd4ff';
  hctx.fillText(`BEST ${best}`, w - 40, 80);

  hctx.textAlign = 'center';
  if (gameOver) {
    hctx.fillStyle = '#ff5a5a';
    hctx.font = 'bold 54px system-ui, sans-serif';
    hctx.fillText('GAME OVER — squeeze trigger', w / 2, 185);
  } else {
    hctx.font = 'bold 72px system-ui, sans-serif';
    let hearts = '';
    for (let i = 0; i < MAX_HEALTH; i++) hearts += i < health ? '♥' : '♡';
    hctx.fillStyle = '#ff4d6d';
    hctx.fillText(hearts, w / 2, 185);
  }
  hudTex.needsUpdate = true;
}

// ---------- Game state ----------
const MAX_HEALTH = 5;
let score = 0, health = MAX_HEALTH, gameOver = false, best = 0;
try { best = Number(localStorage.getItem('saberBest')) || 0; } catch (e) {}
function saveBest(v) {
  best = v;
  try { localStorage.setItem('saberBest', String(v)); } catch (e) {}
}

function resetGame() {
  score = 0;
  health = MAX_HEALTH;
  gameOver = false;
  clearBolts();
  spawnDrone();
  fireTimer = 2.5;
  drawHUD();
}

function endGame() {
  gameOver = true;
  clearBolts();
  drawHUD();
  tone(400, 0.6, 'triangle', 0.12, -300);
}

renderer.xr.addEventListener('sessionstart', () => {
  ensureAudio();
  head.set(0, 1.6, 0);
  resetGame();
});

// ---------- Main loop ----------
function update(dt) {
  time += dt;
  droneRing.rotation.z += dt * 3;
  updateSparks(dt);

  if (!renderer.xr.isPresenting) {
    drone.position.y = 1.6 + Math.sin(time * 2) * 0.1;
    return;
  }

  camera.getWorldPosition(head);
  updateSabers(dt);
  flashMat.opacity = Math.max(0, flashMat.opacity - dt * 2);

  if (gameOver) return;

  if (droneAlive) {
    moveTimer -= dt;
    if (moveTimer <= 0) {
      pickDronePoint(droneTarget);
      moveTimer = 1.5 + Math.random() * 2;
    }
    drone.position.lerp(droneTarget, 1 - Math.exp(-dt * 1.2));
    drone.lookAt(head);
    fireTimer -= dt;
    if (fireTimer <= 0) {
      fireBolt();
      fireTimer = Math.max(0.55, 1.8 - score * 0.025) * (0.7 + Math.random() * 0.6);
    }
  } else {
    respawnTimer -= dt;
    if (respawnTimer <= 0) spawnDrone();
  }

  updateBolts(dt);
  if (health <= 0) endGame();
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

drawHUD();
</script>
</body>
</html>
